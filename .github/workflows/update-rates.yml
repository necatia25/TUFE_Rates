name: Update TÜFE rates

# TÜİK's publication date drifts — usually the 3rd, sometimes later. Rather
# than guess, check every day. The script commits only when rates.json
# actually changes, so most runs exit having done nothing. Actions minutes
# are free on public repos, so daily costs nothing but picks up a new rate
# within 24h of publication whenever it lands.
#
# 09:00 UTC = 12:00 Türkiye, safely after TÜİK's morning release.
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install requests pandas

      - name: Fetch rates from EVDS
        env:
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
        run: python fetch_tufe.py --yes

      # The script exits non-zero if its sanity checks fail, so a bad figure
      # never reaches this step: the workflow goes red and GitHub emails you.
      - name: Commit if changed
        run: |
          git config user.name  "rates-bot"
          git config user.email "actions@github.com"
          if git diff --quiet rates.json; then
            echo "No change today."
          else
            git add rates.json
            git commit -m "TÜFE rates $(date +%Y-%m-%d)"
            git push
          fi
